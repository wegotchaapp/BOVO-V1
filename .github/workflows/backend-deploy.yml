name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-modules-${{ hashFiles('backend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Require a browser origin allowlist
        # APP_URL is the API's own origin and no browser client uses it, so it
        # was never a valid allowlist. main.ts used `origin: true` until CORS was
        # tightened, which is why nothing noticed. createCorsOptions now throws
        # in production on an empty list — fail here with a readable message
        # rather than shipping a container that crash-loops.
        env:
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
        run: |
          if [ -z "$ALLOWED_ORIGINS" ]; then
            echo "::error::ALLOWED_ORIGINS is not set. It must be a comma-separated list of the browser origins that call this API - the admin dashboard's origin, plus the Expo web origin if that build is hosted. It is not APP_URL."
            exit 1
          fi
          echo "Allowlisting $(echo "$ALLOWED_ORIGINS" | tr ',' '\n' | grep -c .) origin(s)."

      - name: Require a counted reverse-proxy depth
        # TRUST_PROXY_HOPS decides which X-Forwarded-For entry is trusted for
        # rate-limit bucketing, so it cannot be defaulted here: any guess is
        # either "trust a caller-supplied address" (too high) or "bucket every
        # client behind the edge together", which locks the platform out of
        # /auth/login as soon as one caller is noisy (too low). It is a fact
        # about the deployment topology — count the proxies in front of this
        # service and set the repository variable. trustedProxyHops() throws on
        # an unset value in production, so the alternative to failing here is a
        # container that crash-loops after Railway has already cut traffic over.
        env:
          TRUST_PROXY_HOPS: ${{ vars.TRUST_PROXY_HOPS }}
        run: |
          if [ -z "$TRUST_PROXY_HOPS" ]; then
            echo "::error::TRUST_PROXY_HOPS is not set. Set the repository variable to the number of reverse proxies in front of this API - 1 for a single Railway or Cloudflare edge, 2 when both are in the path. Do not guess it."
            exit 1
          fi
          case "$TRUST_PROXY_HOPS" in
            ''|*[!0-9]*)
              echo "::error::TRUST_PROXY_HOPS must be a non-negative integer, got '$TRUST_PROXY_HOPS'."
              exit 1
              ;;
          esac
          echo "Trusting the right-most $TRUST_PROXY_HOPS X-Forwarded-For entry/entries."

      - name: Require a Twilio callback origin
        # TwilioSignatureGuard rebuilds the URL Twilio signed from this value
        # instead of from Host/X-Forwarded-Host, which a caller controls. Unset
        # means every Twilio callback (STOP opt-outs included) answers 500.
        #
        # Presence only. The shape of the value is checked by
        # scripts/write-deploy-env.cjs, which has `new URL` and so can reject a
        # path, query or userinfo that a `https://*` glob would wave through.
        env:
          TWILIO_WEBHOOK_BASE_URL: ${{ secrets.TWILIO_WEBHOOK_BASE_URL }}
        run: |
          if [ -z "$TWILIO_WEBHOOK_BASE_URL" ]; then
            echo "::error::TWILIO_WEBHOOK_BASE_URL is not set. It is the public https origin Twilio posts to (scheme + host, no trailing path) and must match the webhook URLs configured in the Twilio console exactly."
            exit 1
          fi

      - name: Load production .env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_ENV: production
          APP_URL: ${{ secrets.APP_URL }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          LOG_LEVEL: warn
          TRUST_PROXY_HOPS: ${{ vars.TRUST_PROXY_HOPS }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          # Three distinct endpoint secrets, copied from three different Stripe
          # webhook endpoints. Pointing them at one value defeats the
          # per-endpoint check each receiver performs.
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_CONNECT_WEBHOOK_SECRET: ${{ secrets.STRIPE_CONNECT_WEBHOOK_SECRET }}
          STRIPE_IDENTITY_WEBHOOK_SECRET: ${{ secrets.STRIPE_IDENTITY_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
          TWILIO_WEBHOOK_BASE_URL: ${{ secrets.TWILIO_WEBHOOK_BASE_URL }}
          CHECKR_API_KEY: ${{ secrets.CHECKR_API_KEY }}
          CHECKR_WEBHOOK_SECRET: ${{ secrets.CHECKR_WEBHOOK_SECRET }}
          CHECKR_API_URL: ${{ secrets.CHECKR_API_URL }}
          NOONLIGHT_API_KEY: ${{ secrets.NOONLIGHT_API_KEY }}
          NOONLIGHT_API_URL: ${{ secrets.NOONLIGHT_API_URL }}
          NOONLIGHT_WEBHOOK_SECRET: ${{ secrets.NOONLIGHT_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cp .env.example .env
          node scripts/write-deploy-env.cjs .env

      - name: TypeScript Check
        run: npx tsc --noEmit

      # Keep lint visible during deployments, but mirror backend-ci until the
      # inherited strict-type backlog is reduced. TypeScript, tests, build, and
      # migrations remain blocking; new code is checked in focused review.
      - name: Lint (legacy backlog)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      # Migrations run from CI (after build) so ts-node and dist/ are both
      # available. Running them before `railway up` ensures the schema is
      # ready before new code starts serving traffic.
      - name: Run Migrations
        run: npm run migration:run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Create Sentry Release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: backend
        with:
          environment: production
          sourcemaps: './backend/dist'
