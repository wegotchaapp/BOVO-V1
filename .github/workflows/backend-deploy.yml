name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: ${{ runner.os }}-backend-modules-${{ hashFiles('backend/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Require a browser origin allowlist
        # APP_URL is the API's own origin and no browser client uses it, so it
        # was never a valid allowlist. main.ts used `origin: true` until CORS was
        # tightened, which is why nothing noticed. createCorsOptions now throws
        # in production on an empty list — fail here with a readable message
        # rather than shipping a container that crash-loops.
        env:
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
        run: |
          if [ -z "$ALLOWED_ORIGINS" ]; then
            echo "::error::ALLOWED_ORIGINS is not set. It must be a comma-separated list of the browser origins that call this API - the admin dashboard's origin, plus the Expo web origin if that build is hosted. It is not APP_URL."
            exit 1
          fi
          echo "Allowlisting $(echo "$ALLOWED_ORIGINS" | tr ',' '\n' | grep -c .) origin(s)."

      - name: Load production .env
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          APP_ENV: production
          APP_URL: ${{ secrets.APP_URL }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          LOG_LEVEL: warn
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          cp .env.example .env
          node scripts/write-deploy-env.cjs .env

      - name: TypeScript Check
        run: npx tsc --noEmit

      # Keep lint visible during deployments, but mirror backend-ci until the
      # inherited strict-type backlog is reduced. TypeScript, tests, build, and
      # migrations remain blocking; new code is checked in focused review.
      - name: Lint (legacy backlog)
        run: npm run lint
        continue-on-error: true

      - name: Build
        run: npm run build

      # Migrations run from CI (after build) so ts-node and dist/ are both
      # available. Running them before `railway up` ensures the schema is
      # ready before new code starts serving traffic.
      - name: Run Migrations
        run: npm run migration:run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service ${{ secrets.RAILWAY_SERVICE_ID }}
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Create Sentry Release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: backend
        with:
          environment: production
          sourcemaps: './backend/dist'
