name: Mobile CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./mobile
        run: pnpm install --frozen-lockfile

      - name: Configure CI environment
        working-directory: ./mobile
        run: |
          cp artifacts/mobile/.env.example artifacts/mobile/.env
          sed -i "s|EXPO_PUBLIC_API_URL=.*|EXPO_PUBLIC_API_URL=http://localhost:3000|" artifacts/mobile/.env

      - name: TypeScript Check
        working-directory: ./mobile
        run: pnpm run typecheck

      - name: Release bundle check
        working-directory: ./mobile
        run: pnpm run release:check
        env:
          EXPO_PUBLIC_API_URL: http://localhost:3000
          EXPO_PUBLIC_MAPBOX_TOKEN: pk.test-token
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci
