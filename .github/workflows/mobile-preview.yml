name: Mobile Preview

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./mobile
        run: pnpm install --frozen-lockfile

      - name: Verify release bundle
        working-directory: ./mobile
        run: pnpm run release:check
        env:
          EXPO_PUBLIC_API_URL: https://staging-api.bovogo.com
          EXPO_PUBLIC_MAPBOX_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_TOKEN }}
          EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Configure Expo Credentials
        working-directory: ./mobile/artifacts/mobile
        run: printf '%s' "$EXPO_CREDENTIALS_JSON" > credentials.json
        env:
          EXPO_CREDENTIALS_JSON: ${{ secrets.EXPO_CREDENTIALS_JSON }}

      - name: Build Preview APK
        id: eas-build
        working-directory: ./mobile/artifacts/mobile
        run: |
          EAS_BUILD_OUTPUT=$(eas build --platform android --profile preview --non-interactive --json 2>&1)
          echo "$EAS_BUILD_OUTPUT"
          EAS_BUILD_URL=$(echo "$EAS_BUILD_OUTPUT" | jq -r '.[0].link')
          echo "build_url=$EAS_BUILD_URL" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
