<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bovogo — Expo Go QR Code</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #0a1a12;
      color: #fff;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      color: #0a1a12;
      border-radius: 24px;
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 20px; color: #445; line-height: 1.45; font-size: 15px; }
    img {
      width: 280px;
      height: 280px;
      background: #fff;
      border: 8px solid #fff;
      border-radius: 12px;
    }
    .link {
      margin-top: 18px;
      padding: 12px 14px;
      background: #EBF2ED;
      border-radius: 12px;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 14px;
      word-break: break-all;
      color: #0B3D2E;
      font-weight: 600;
    }
    .steps {
      text-align: left;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #e5e7eb;
      color: #334;
      font-size: 14px;
      line-height: 1.5;
    }
    .steps ol { margin: 8px 0 0; padding-left: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Scan with Expo Go</h1>
    <p>Open the Expo Go app on your phone and scan this code.</p>
    <img
      src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=12&data=exp%3A%2F%2F192.168.1.198%3A8082"
      alt="Expo Go QR code for exp://192.168.1.198:8082"
    />
    <div class="link">exp://192.168.1.198:8082</div>
    <div class="steps">
      <strong>If the camera won’t scan:</strong>
      <ol>
        <li>Open <strong>Expo Go</strong> on your phone</li>
        <li>Tap <strong>Enter URL manually</strong></li>
        <li>Paste: <code>exp://192.168.1.198:8082</code></li>
        <li>Phone and PC must be on the same Wi‑Fi</li>
      </ol>
    </div>
  </div>
</body>
</html>
